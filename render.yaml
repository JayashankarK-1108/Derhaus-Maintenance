services:
  - type: web
    name: derhaus-maintenance
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in the Render dashboard
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        sync: false          # Shared PIN required to save changes
      - key: NODE_VERSION
        value: 22.17.1
